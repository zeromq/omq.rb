name: CI

on: [push, pull_request]

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '4.0']
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libzmq3-dev
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: timeout 240 bundle exec rake

  truffleruby-rust-backend:
    name: TruffleRuby rust backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: truffleruby
        bundler-cache: true
        working-directory: gems/omq-backend-rust
    - run: timeout 240 bundle exec rake
      working-directory: gems/omq-backend-rust

  jruby-rust-backend:
    name: JRuby rust backend
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Fetch OMQ.java
      run: mvn -q dependency:get -Dartifact=io.github.paddor:omq-java:0.3.0:jar:linux-x86_64
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: jruby-10.1.1.0
    - name: Install Ruby dependencies
      run: gem install --no-document async io-stream minitest rake console nuckle jar-dependencies
    - run: RUBYLIB="../../lib:../protocol-zmtp/lib" timeout 240 rake test
      working-directory: gems/omq-backend-rust
